name: Mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
      # Backend contracts the app consumes.
      - "src/modules/apis/v1/auth/**"
      - "src/modules/apis/v1/spaces/**"
      - "src/modules/apis/dependencies.py"
  push:
    branches:
      - dev
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
      # Backend contracts the app consumes.
      - "src/modules/apis/v1/auth/**"
      - "src/modules/apis/v1/spaces/**"
      - "src/modules/apis/dependencies.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.6"

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    name: Format, analyze, test, Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/gen
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart --dart-define-from-file=config/dev.json

  ios:
    name: iOS simulator build (no signing)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --flavor dev -t lib/main_dev.dart --dart-define-from-file=config/dev.json
