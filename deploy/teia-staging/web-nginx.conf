server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The service worker and the HTML shell must not be cached, so updates and token scrubbing apply at once.
    location = /service-worker.js { add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    # Client-side routes such as /join-space and /auth.
    location / { try_files $uri /index.html; }
}
