[tool.poetry]
name = "teia-ai-agents"
version = "0.1.0"
description = "Production-ready Agentic AI System with multi-agent orchestration"
authors = ["TEIA Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "3.11.14"

# Web Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = {extras = ["email"], version = "^2.12.5"}
pydantic-settings = "^2.6.0"

# LLM Providers
openai = "^1.54.0"
anthropic = "^0.39.0"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-anthropic = "^0.3.0"
langchain-community = "^0.3.0"

# Agent Frameworks
langgraph = "^0.2.0"

# Async & Concurrency
aiohttp = "^3.10.0"
httpx = "^0.27.0"

# Databases
asyncpg = "^0.30.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
alembic = "^1.14.0"
neo4j = "^5.26.0"
redis = {extras = ["hiredis"], version = "^5.2.0"}
qdrant-client = "^1.12.1"

# Caching & Queuing
celery = {extras = ["redis"], version = "^5.4.0"}
kombu = "^5.4.0"

# Cloud Services
boto3 = "^1.35.0"
aioboto3 = "^13.0.0"
azure-identity = "^1.19.0"
azure-storage-blob = "^12.24.0"
google-cloud-storage = "^2.18.0"

# Observability & Monitoring
prometheus-client = "^0.21.0"
langfuse = "^3.10.6"
structlog = "^24.4.0"

# Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.17"
cryptography = "^44.0.0"

# Utilities
python-dotenv = "^1.0.0"
pyyaml = "^6.0.1"
tenacity = "^9.0.0"
tiktoken = "^0.8.0"
python-dateutil = "^2.9.0"

# Data Processing
pandas = "^2.2.0"
numpy = "^1.26.0"

# Document Processing
aiofiles = "^24.1.0"
pypdf2 = "^3.0.0"
python-docx = "^1.1.0"
openpyxl = "^3.1.0"
python-pptx = "^0.6.23"
bcrypt = ">=3.2,<4"
unstructured = {extras = ["pdf", "docx", "pptx"], version = "^0.12.0"}
pdfplumber = "^0.11.0"
pymupdf = "^1.24.0"
pymupdf4llm = "^0.0.17"
pytesseract = "^0.3.13"
mammoth = "^1.8.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.1.0"
langchain-text-splitters = "^0.3.0"
langchain-google-genai = "^2.1.0"
# google-adk intentionally not pinned here because it conflicts with this stack's uvicorn/httpx/tenacity versions.
# The code is ADK-compatible via src/modules/agents/common/llm_factory.py and can be installed in a dedicated env.
sentence-transformers = "^2.3.0"
rank-bm25 = "^0.2.2"
spacy = "^3.7.0"
nltk = "^3.8.0"
presidio-analyzer = "^2.2.0"
presidio-anonymizer = "^2.2.0"
orjson = "^3.9.0"

# Web Search & Tools
duckduckgo-search = "^6.3.0"
fpdf2 = "^2.7.9"
reportlab = "^4.2.5"
pillow = "^10.4.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
setuptools = "^80.9.0"
wheel = "^0.45.1"
colorlog = "^6.10.1"
skylos = "^3.1.1"
tesseract = "^0.1.3"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
faker = "^32.0.0"

# Code Quality
black = "^24.10.0"
isort = "^5.13.0"
flake8 = "^7.1.0"
mypy = "^1.13.0"
pylint = "^3.3.0"
bandit = "^1.8.0"

# Pre-commit Hooks
pre-commit = "^4.0.0"

# Documentation
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"

# Development Tools
ipython = "^8.30.0"
jupyter = "^1.1.0"

[tool.poetry.scripts]
teia = "src.main:main"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "kombu.*",
    "neo4j.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
